<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TermOS LT 🌌 // SECURE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
/* --- STYLES --- */
:root {
    --main-bg: #050505;
    --term-color: #33ff00;
    --term-glow: 0 0 10px rgba(51, 255, 0, 0.5);
    --danger-color: #ff3333;
    --system-color: #ffff00;
    --user-color: #ffffff;
    --xp-color: #00ffff;
    --font-stack: 'Courier New', Courier, monospace;
    --panel-bg: #0a0a0a;
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: text; }

body {
    background-color: #000;
    color: var(--term-color);
    font-family: var(--font-stack);
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    overflow: hidden;
}

#os-container {
    width: 100%; 
    max-width: 1000px; 
    height: 95vh;
    background-color: var(--main-bg); 
    border: 2px solid var(--term-color);
    display: grid; 
    grid-template-rows: auto 1fr auto;
    position: relative; 
    box-shadow: var(--term-glow);
    margin: 10px;
}

/* Scanlines */
#os-container::before {
    content: " "; display: block; position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 10; background-size: 100% 2px, 3px 100%; pointer-events: none;
}

/* HEADER */
header {
    border-bottom: 1px solid var(--term-color); 
    padding: 10px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    z-index: 5;
    background: var(--panel-bg);
}

.header-left, .header-right { display: flex; gap: 15px; align-items: center; }

.xp-container { width: 100px; display: flex; flex-direction: column; gap: 2px; }
.xp-bar-bg { width: 100%; height: 6px; background: #333; border: 1px solid var(--term-color); }
.xp-bar-fill { height: 100%; width: 0%; background: var(--xp-color); transition: width 0.5s ease; }

.avatar-display { font-size: 1.2rem; line-height: 1rem; }

.room-badge { border: 1px solid var(--system-color); padding: 2px 8px; font-weight: bold; color: var(--system-color); }

/* MAIN AREA */
main { display: grid; grid-template-columns: 200px 1fr; overflow: hidden; z-index: 5; }

.sidebar {
    border-right: 1px solid var(--term-color);
    padding: 10px; overflow-y: auto;
    background: rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 15px;
}

.app-card {
    border: 1px dashed var(--term-color);
    padding: 5px; cursor: pointer; font-size: 0.8rem;
    transition: background 0.2s;
}
.app-card:hover { background: rgba(51, 255, 0, 0.1); }

#terminal-output {
    padding: 20px; overflow-y: auto; white-space: pre-wrap;
    scroll-behavior: smooth; word-wrap: break-word;
}

/* FOOTER */
footer {
    border-top: 1px solid var(--term-color);
    padding: 10px; display: flex; align-items: center; gap: 10px;
    background: var(--panel-bg); z-index: 5;
}

.prompt { font-weight: bold; animation: blink 1s step-end infinite; white-space: nowrap; }
input[type="text"] {
    background: transparent; border: none; color: var(--term-color);
    font-family: var(--font-stack); font-size: 1.1rem; flex-grow: 1; text-transform: uppercase;
}

.btn-icon {
    background: none; border: 1px solid var(--term-color);
    color: var(--term-color); padding: 5px 10px; cursor: pointer;
    font-family: var(--font-stack);
}
.btn-icon:hover { background: var(--term-color); color: #000; }
.btn-icon.active { background: var(--term-color); color: #000; animation: pulse 1.5s infinite; }

/* TEXT STYLES */
.system-msg { color: var(--system-color); opacity: 0.8; }
.user-msg { color: var(--user-color); font-weight: bold; }
.other-msg { color: var(--term-color); }
.ai-msg { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
.error-msg { color: var(--danger-color); font-weight: bold; }
.cmd-msg { color: #ff00ff; }

.hidden { display: none !important; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

@media (max-width: 700px) {
    #os-container { margin: 0; height: 100vh; border: none; }
    main { grid-template-columns: 1fr; }
    .sidebar { display: none; position: absolute; top: 50px; left: 0; width: 100%; height: 80%; background: #000; border-bottom: 1px solid var(--term-color); }
    .sidebar.show { display: flex; }
}
</style>
</head>
<body>

<div id="os-container">
    <header>
        <div class="header-left">
            <div id="avatar-box" class="avatar-display">o_o</div>
            <div class="xp-container">
                <span style="font-size:0.7rem">LVL <span id="level-display">1</span></span>
                <div class="xp-bar-bg"><div id="xp-fill" class="xp-bar-fill"></div></div>
            </div>
            <button class="btn-icon" onclick="toggleSidebar()">📂 APPS</button>
        </div>
        <div class="room-badge" id="current-room">LIBRARY</div>
        <div class="header-right">
            <span id="ai-provider" style="color:#00ffff; font-size:0.7rem;">OFFLINE</span>
            <span id="net-status">OFFLINE</span>
        </div>
    </header>

    <main>
        <div id="sidebar" class="sidebar">
            <div style="color:var(--system-color)">INSTALLED PLUGINS</div>
            <div id="plugin-list">
                <div class="app-card" onclick="runPlugin('greeter')">👋 Auto-Greeter</div>
                <div class="app-card" onclick="runPlugin('hacker_mode')">🕶️ Hacker Mode</div>
            </div>
            <div style="color:var(--system-color)">SYSTEM</div>
            <div class="app-card" onclick="executeSystemCommand('/stats')">📊 Stats</div>
            <div class="app-card" onclick="executeSystemCommand('/avatar')">🎭 Avatar</div>
            <div class="app-card" onclick="executeSystemCommand('/voice')">🗣️ Voice</div>
            <div class="app-card" onclick="executeSystemCommand('/resetkeys')">🔑 Update Keys</div>
        </div>
        <div id="terminal-output">
            <div id="intro">
                <p>BOOTING TermOS LT v3.1 (SECURE BUILD)...</p>
                <p>NO HARDCODED CREDENTIALS FOUND.</p>
                <p>&nbsp;</p>
                <p>SYSTEM READY.</p>
            </div>
        </div>
    </main>

    <footer>
        <span class="prompt">></span>
        <input type="text" id="command-input" autocomplete="off" autofocus placeholder="Enter command or chat...">
        <button class="btn-icon" id="voice-btn" onclick="toggleVoice()">🎤</button>
        <button class="btn-icon" onclick="sendMessage()">⚡</button>
    </footer>
</div>

<script>
/* --- SECURITY & CONFIG --- */
const getSecureKey = (name) => {
    let key = localStorage.getItem('termos_key_' + name);
    if (!key || key === "null" || key === "") {
        // Ask user for key ONLY if not found in storage
        key = window.prompt(`SECURE CHECK: Enter your ${name} Key (stored locally):`);
        if (key) {
            localStorage.setItem('termos_key_' + name, key);
        }
    }
    return key || "";
};

const CONFIG = {
    mqtt: { host: "broker.hivemq.com", port: 8884, baseTopic: "termos/lt/v4" },
    // KEYS ARE NO LONGER HARDCODED. They are fetched via secure prompt.
    keys: {
        openai: getSecureKey('openai'),
        groq: getSecureKey('groq'),
        zhipu: getSecureKey('zhipu')
    },
    rooms: {
        library: { name: "LIBRARY", persona: "You are a helpful Librarian AI. Be concise.", topic: "library" },
        workshop: { name: "WORKSHOP", persona: "You are a Coder AI. Write code in markdown blocks.", topic: "workshop" },
        lounge: { name: "LOUNGE", persona: "You are a fun Gamer AI. Be energetic.", topic: "lounge" }
    }
};

/* --- STATE MANAGEMENT --- */
const State = {
    user: JSON.parse(localStorage.getItem('termos_user')) || { nick: "Anon" + Math.floor(Math.random()*1000), xp: 0, level: 1, room: 'library' },
    client: null,
    isConnected: false,
    voiceEnabled: false,
    recognition: null,
    synthesis: window.speechSynthesis
};

/* --- PERSISTENCE --- */
function saveState() {
    localStorage.setItem('termos_user', JSON.stringify(State.user));
    updateUI();
}

function addXP(amount) {
    State.user.xp += amount;
    const nextLevel = State.user.level * 100;
    if (State.user.xp >= nextLevel) {
        State.user.level++;
        State.user.xp -= nextLevel;
        logSystem(`LEVEL UP! YOU ARE NOW LEVEL ${State.user.level}`, "ai-msg");
        playSound('success');
    }
    saveState();
}

const AVATARS = { 1: "o_o", 2: "o.o", 3: "(o.o)", 4: "/\\_/\\", 5: "🧙", 6: "🧛", 7: "🤖", 8: "👾", 9: "👽", 10: "🌌" };

/* --- AUDIO --- */
const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (AudioCtx.state === 'suspended') AudioCtx.resume();
    const osc = AudioCtx.createOscillator();
    const gain = AudioCtx.createGain();
    osc.connect(gain); gain.connect(AudioCtx.destination);
    if (type === 'type') { osc.frequency.value = 800; gain.gain.value = 0.05; osc.start(); osc.stop(AudioCtx.currentTime + 0.05); }
    else if (type === 'success') { osc.frequency.value = 440; gain.gain.value = 0.1; osc.start(); osc.stop(AudioCtx.currentTime + 0.3); }
}

/* --- VOICE --- */
function initVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    State.recognition = new SpeechRecognition();
    State.recognition.continuous = false;
    State.recognition.lang = 'en-US';
    State.recognition.onresult = (event) => {
        processInput(event.results[0][0].transcript);
    };
    State.recognition.onend = () => { document.getElementById('voice-btn').classList.remove('active'); };
}

function toggleVoice() {
    if (!State.recognition) initVoice();
    if (State.voiceEnabled) { State.recognition.stop(); State.voiceEnabled = false; }
    else { State.recognition.start(); document.getElementById('voice-btn').classList.add('active'); State.voiceEnabled = true; }
}

function speak(text) {
    if (State.synthesis.speaking) State.synthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.pitch = 0.8; utterance.rate = 1.2;
    State.synthesis.speak(utterance);
}

/* --- MQTT --- */
function connectMQTT() {
    const clientId = `termos-${State.user.nick}-${Date.now()}`;
    State.client = new Paho.MQTT.Client(CONFIG.mqtt.host, CONFIG.mqtt.port, clientId);
    State.client.onConnectionLost = () => { State.isConnected = false; document.getElementById('net-status').textContent = "OFFLINE"; };
    State.client.onMessageArrived = (msg) => {
        try {
            const data = JSON.parse(msg.payloadString);
            if (data.nick !== State.user.nick) {
                logMessage(data.nick, data.text, "other-msg");
                playSound('type');
            }
        } catch(e){}
    };
    State.client.connect({
        timeout: 10, useSSL: true, mqttVersion: 4, cleanSession: true,
        onSuccess: () => {
            State.isConnected = true;
            document.getElementById('net-status').textContent = "ONLINE";
            joinRoom(State.user.room);
            logSystem("UPLINK ESTABLISHED.", "system");
        },
        onFailure: () => { logSystem("MQTT CONNECTION FAILED", "error-msg"); }
    });
}

function joinRoom(roomKey) {
    if(!State.isConnected) return;
    State.client.unsubscribe(`${CONFIG.mqtt.baseTopic}/${State.user.room}`);
    State.user.room = roomKey;
    State.client.subscribe(`${CONFIG.mqtt.baseTopic}/${roomKey}`);
    document.getElementById('current-room').textContent = CONFIG.rooms[roomKey].name;
    saveState();
    logSystem(`ENTERED ROOM: ${CONFIG.rooms[roomKey].name}`, "system");
}

/* --- AI ENGINE --- */
async function queryAI(prompt) {
    logSystem("CONTACTING NEURAL NET...", "ai-msg");
    const systemPrompt = `${CONFIG.rooms[State.user.room].persona} You are an agent in TermOS. 
    You have tools: "switch_room", "play_music", "fix_app". 
    If you use a tool, output it as a JSON block inside ```json ... ```. 
    Otherwise, just answer user.`;

    let result = null;
    
    // TRY OPENAI
    if (CONFIG.keys.openai && CONFIG.keys.openai.startsWith("sk-")) {
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.keys.openai}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: prompt }],
                    temperature: 0.7
                })
            });
            if (res.ok) {
                const data = await res.json();
                result = data.choices[0].message.content;
                document.getElementById('ai-provider').textContent = "AI: OPENAI";
            } else { throw new Error(res.status); }
        } catch (e) { logSystem(`OPENAI ERROR: ${e.message}`, "error-msg"); }
    }

    // TRY GROQ
    if (!result && CONFIG.keys.groq && CONFIG.keys.groq.startsWith("gsk_")) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.keys.groq}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: prompt }]
                })
            });
            if (res.ok) {
                const data = await res.json();
                result = data.choices[0].message.content;
                document.getElementById('ai-provider').textContent = "AI: GROQ";
            }
        } catch (e) { logSystem(`GROQ ERROR: ${e.message}`, "error-msg"); }
    }

    // PARSE RESULT
    if (result) {
        const jsonMatch = result.match(/```json\s*([\s\S]*?)\s*```/);
        if (jsonMatch) {
            try {
                const toolData = JSON.parse(jsonMatch[1]);
                handleToolCall(toolData);
                logSystem("AI: Executing Protocol...", "cmd-msg");
            } catch (e) { logSystem("AI: " + result, "ai-msg"); }
        } else {
            logSystem("AI: " + result, "ai-msg");
            speak(result);
        }
        addXP(10);
    } else {
        logSystem("ALL AI PROVIDERS OFFLINE OR KEY MISSING. RUN /RESETKEYS", "error-msg");
    }
}

function handleToolCall(data) {
    if (data.switch_room) joinRoom(data.switch_room);
    if (data.play_music) {
        playSound('success');
        logSystem("🎵 PLAYING GENERATED AUDIO...", "cmd-msg");
    }
    if (data.fix_app) {
        try {
            const func = new Function(data.fix_app);
            func();
            logSystem("APP UPDATED SUCCESSFULLY.", "system");
        } catch(e) { logSystem("UPDATE FAILED: " + e.message, "error-msg"); }
    }
}

/* --- UI LOGIC --- */
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

const inputField = document.getElementById('command-input');
inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') processInput(inputField.value); });

async function processInput(rawText) {
    const text = rawText.trim().toUpperCase();
    inputField.value = "";
    playSound('type');
    if (!text) return;

    if (text.startsWith('/')) { executeSystemCommand(text); return; }
    
    logMessage(State.user.nick, text, "user-msg");
    
    if (State.isConnected) {
        const msg = new Paho.MQTT.Message(JSON.stringify({ nick: State.user.nick, text: text }));
        msg.destinationName = `${CONFIG.mqtt.baseTopic}/${State.user.room}`;
        State.client.send(msg);
    }
    
    if (text.includes("AI") || text.includes("HELP")) queryAI(rawText);
}

function executeSystemCommand(cmd) {
    const parts = cmd.split(' ');
    const command = parts[0].toLowerCase();

    switch (command) {
        case '/help': logSystem("COMMANDS: /ROOM, /NICK, /AI [PROMPT], /CLEAR, /RESETKEYS", "system"); break;
        case '/room': 
            const r = parts[1]?.toLowerCase();
            if (CONFIG.rooms[r]) joinRoom(r);
            else logSystem("INVALID ROOM", "error-msg"); 
            break;
        case '/nick': 
            State.user.nick = parts[1] || "Anon"; saveState(); 
            logSystem(`NICK UPDATED: ${State.user.nick}`, "system"); 
            break;
        case '/clear': document.getElementById('terminal-output').innerHTML = ""; break;
        case '/ai': 
            const prompt = cmd.substring(4).trim();
            if (prompt) queryAI(prompt); 
            else logSystem("NEED PROMPT", "error-msg"); 
            break;
        case '/stats': logSystem(`LVL ${State.user.level} | XP ${State.user.xp}`, "ai-msg"); break;
        case '/avatar': document.getElementById('avatar-box').textContent = AVATARS[State.user.level]; break;
        case '/voice': toggleVoice(); break;
        case '/resetkeys':
            // Force reset of keys
            localStorage.removeItem('termos_key_openai');
            localStorage.removeItem('termos_key_groq');
            localStorage.removeItem('termos_key_zhipu');
            location.reload();
            break;
        default: logSystem(`UNKNOWN COMMAND`, "error-msg");
    }
}

function runPlugin(name) {
    if (name === 'greeter') logMessage("SYS", "Welcome to TermOS! Systems Nominal.", "system");
    if (name === 'hacker_mode') {
        document.documentElement.style.setProperty('--term-color', '#00ff00');
        document.body.style.backgroundColor = '#000';
        logSystem("HACKER MODE ENGAGED.", "cmd-msg");
    }
    addXP(20);
}

function logMessage(nick, text, type) {
    const div = document.createElement('div');
    div.className = type;
    const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute:'2-digit' });
    div.innerHTML = `<span style="opacity:0.5">[${time}]</span> <b>&lt;${nick}&gt;</b> ${text}`;
    document.getElementById('terminal-output').appendChild(div);
    scrollToBottom();
    addXP(1);
}

function logSystem(text, type) {
    const div = document.createElement('div');
    div.className = type;
    const time = new Date().toLocaleTimeString([], { hour12: false });
    div.innerHTML = `[${time}] ${text}`;
    document.getElementById('terminal-output').appendChild(div);
    scrollToBottom();
}

function updateUI() {
    document.getElementById('level-display').innerText = State.user.level;
    document.getElementById('avatar-box').textContent = AVATARS[State.user.level] || "o_o";
    const totalForNext = State.user.level * 100;
    const percentage = (State.user.xp / totalForNext) * 100;
    document.getElementById('xp-fill').style.width = `${percentage}%`;
}

function scrollToBottom() { document.getElementById('terminal-output').scrollTop = document.getElementById('terminal-output').scrollHeight; }

window.onload = () => { updateUI(); connectMQTT(); logSystem("SYSTEM READY. KEYS SECURE.", "system"); };
</script>
</body>
</html>
