<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TermOS LT 🌌 // DEEPSEEK INTEGRATED</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
/* --- STYLES --- */
:root {
    --main-bg: #050505;
    --term-color: #33ff00;
    --term-glow: 0 0 10px rgba(51, 255, 0, 0.5);
    --danger-color: #ff3333;
    --system-color: #ffff00;
    --user-color: #ffffff;
    --xp-color: #00ffff;
    --font-stack: 'Courier New', Courier, monospace;
    --panel-bg: #0a0a0a;
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: text; }

body {
    background-color: #000;
    color: var(--term-color);
    font-family: var(--font-stack);
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    overflow: hidden;
}

#os-container {
    width: 100%; 
    max-width: 1000px; 
    height: 95vh;
    background-color: var(--main-bg); 
    border: 2px solid var(--term-color);
    display: grid; 
    grid-template-rows: auto 1fr auto;
    position: relative; 
    box-shadow: var(--term-glow);
    margin: 10px;
}

/* Scanlines */
#os-container::before {
    content: " "; display: block; position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 10; background-size: 100% 2px, 3px 100%; pointer-events: none;
}

/* HEADER */
header {
    border-bottom: 1px solid var(--term-color); 
    padding: 10px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    z-index: 5;
    background: var(--panel-bg);
}

.header-left, .header-right { display: flex; gap: 15px; align-items: center; }

.xp-container { width: 100px; display: flex; flex-direction: column; gap: 2px; }
.xp-bar-bg { width: 100%; height: 6px; background: #333; border: 1px solid var(--term-color); }
.xp-bar-fill { height: 100%; width: 0%; background: var(--xp-color); transition: width 0.5s ease; }

.avatar-display { font-size: 1.2rem; line-height: 1rem; }

.room-badge { border: 1px solid var(--system-color); padding: 2px 8px; font-weight: bold; color: var(--system-color); }

/* MAIN AREA */
main { display: grid; grid-template-columns: 200px 1fr; overflow: hidden; z-index: 5; }

.sidebar {
    border-right: 1px solid var(--term-color);
    padding: 10px; overflow-y: auto;
    background: rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 15px;
}

.app-card {
    border: 1px dashed var(--term-color);
    padding: 5px; cursor: pointer; font-size: 0.8rem;
    transition: background 0.2s;
}
.app-card:hover { background: rgba(51, 255, 0, 0.1); }

#terminal-output {
    padding: 20px; overflow-y: auto; white-space: pre-wrap;
    scroll-behavior: smooth; word-wrap: break-word;
}

/* FOOTER */
footer {
    border-top: 1px solid var(--term-color);
    padding: 10px; display: flex; align-items: center; gap: 10px;
    background: var(--panel-bg); z-index: 5;
}

.prompt { font-weight: bold; animation: blink 1s step-end infinite; white-space: nowrap; }
input[type="text"] {
    background: transparent; border: none; color: var(--term-color);
    font-family: var(--font-stack); font-size: 1.1rem; flex-grow: 1; text-transform: uppercase;
}

.btn-icon {
    background: none; border: 1px solid var(--term-color);
    color: var(--term-color); padding: 5px 10px; cursor: pointer;
    font-family: var(--font-stack);
}
.btn-icon:hover { background: var(--term-color); color: #000; }
.btn-icon.active { background: var(--term-color); color: #000; animation: pulse 1.5s infinite; }

/* TEXT STYLES */
.system-msg { color: var(--system-color); opacity: 0.8; }
.user-msg { color: var(--user-color); font-weight: bold; }
.other-msg { color: var(--term-color); }
.ai-msg { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
.error-msg { color: var(--danger-color); font-weight: bold; }
.cmd-msg { color: #ff00ff; }
.success-msg { color: #00ff00; font-weight: bold; }

.hidden { display: none !important; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* KEY MODAL */
#key-modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    display: flex; justify-content: center; align-items: center;
}
.key-box {
    background: #000; border: 2px solid var(--term-color);
    padding: 20px; width: 80%; max-width: 500px;
    box-shadow: 0 0 20px var(--term-glow);
    overflow-y: auto; max-height: 80vh;
}
.key-input {
    width: 100%; background: #111; border: 1px solid var(--term-color);
    color: var(--term-color); padding: 10px; margin-bottom: 10px;
    font-family: var(--font-stack); font-size: 0.9rem;
}
.key-label { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 2px; color: #aaa; }

@media (max-width: 700px) {
    #os-container { margin: 0; height: 100vh; border: none; }
    main { grid-template-columns: 1fr; }
    .sidebar { display: none; position: absolute; top: 50px; left: 0; width: 100%; height: 80%; background: #000; border-bottom: 1px solid var(--term-color); }
    .sidebar.show { display: flex; }
}
</style>
</head>
<body>

<div id="os-container">
    <header>
        <div class="header-left">
            <div id="avatar-box" class="avatar-display">o_o</div>
            <div class="xp-container">
                <span style="font-size:0.7rem">LVL <span id="level-display">1</span></span>
                <div class="xp-bar-bg"><div id="xp-fill" class="xp-bar-fill"></div></div>
            </div>
            <button class="btn-icon" onclick="toggleSidebar()">📂 APPS</button>
        </div>
        <div class="room-badge" id="current-room">LIBRARY</div>
        <div class="header-right">
            <span id="ai-provider" style="color:#00ffff; font-size:0.7rem;">OFFLINE</span>
            <span id="net-status">OFFLINE</span>
        </div>
    </header>

    <main>
        <div id="sidebar" class="sidebar">
            <div style="color:var(--system-color)">SYSTEM</div>
            <div class="app-card" onclick="openKeyModal()">🔑 SETUP KEYS</div>
            <div class="app-card" onclick="executeSystemCommand('/stats')">📊 Stats</div>
            <div class="app-card" onclick="executeSystemCommand('/clear')">🗑️ Clear</div>
        </div>
        <div id="terminal-output">
            <div id="intro">
                <p>BOOTING TermOS LT v3.5...</p>
                <p>ADDED PROVIDER: DEEPSEEK.</p>
                <p>READY FOR INPUT.</p>
            </div>
        </div>
    </main>

    <footer>
        <span class="prompt">></span>
        <input type="text" id="command-input" autocomplete="off" autofocus placeholder="Enter command or chat...">
        <button class="btn-icon" onclick="sendMessage()">⚡</button>
    </footer>
</div>

<!-- KEY INPUT MODAL -->
<div id="key-modal" class="hidden">
    <div class="key-box">
        <h3 style="color:var(--system-color); margin-bottom:10px;">SECURE KEY SETUP</h3>
        <div style="font-size:0.8rem; margin-bottom:15px; color:#ccc;">Add keys for redundancy. System auto-falls back.</div>
        
        <div class="key-label"><span>OpenAI Key</span> <span onclick="document.getElementById('input-openai').value=''">❌</span></div>
        <input type="password" id="input-openai" class="key-input" placeholder="sk-proj-...">
        
        <div class="key-label"><span>Groq Key</span> <span onclick="document.getElementById('input-groq').value=''">❌</span></div>
        <input type="password" id="input-groq" class="key-input" placeholder="gsk_...">
        
        <div class="key-label"><span>DeepSeek Key (sk-...)</span> <span onclick="document.getElementById('input-deepseek').value=''">❌</span></div>
        <input type="password" id="input-deepseek" class="key-input" placeholder="sk-...">
        
        <div style="display:flex; justify-content:space-between; gap:10px; margin-top:15px;">
            <button class="btn-icon" onclick="testKeys()" style="border-color:var(--system-color);">TEST KEYS</button>
            <button class="btn-icon" onclick="closeKeyModal()">CANCEL</button>
            <button class="btn-icon" style="background:var(--term-color); color:#000;" onclick="saveKeys()">SAVE</button>
        </div>
        <div id="test-result" style="margin-top:10px; font-size:0.8rem; word-wrap:break-word;"></div>
    </div>
</div>

<script>
/* --- CONFIGURATION --- */
const CONFIG = {
    mqtt: { host: "broker.hivemq.com", port: 8884, baseTopic: "termos/lt/v5" },
    keys: {
        openai: localStorage.getItem('termos_key_openai') || "",
        groq: localStorage.getItem('termos_key_groq') || "",
        deepseek: localStorage.getItem('termos_key_deepseek') || "" // NEW
    },
    rooms: {
        library: { name: "LIBRARY", persona: "You are a helpful Librarian AI.", topic: "library" },
        workshop: { name: "WORKSHOP", persona: "You are a Coder AI.", topic: "workshop" },
        lounge: { name: "LOUNGE", persona: "You are a fun Gamer AI.", topic: "lounge" }
    }
};

/* --- STATE MANAGEMENT --- */
const State = {
    user: JSON.parse(localStorage.getItem('termos_user')) || { nick: "Anon" + Math.floor(Math.random()*1000), xp: 0, level: 1, room: 'library' },
    client: null,
    isConnected: false,
    voiceEnabled: false,
    recognition: null
};

/* --- MODAL LOGIC --- */
function openKeyModal() {
    document.getElementById('input-openai').value = CONFIG.keys.openai;
    document.getElementById('input-groq').value = CONFIG.keys.groq;
    document.getElementById('input-deepseek').value = CONFIG.keys.deepseek; // NEW
    document.getElementById('test-result').textContent = "";
    document.getElementById('key-modal').classList.remove('hidden');
}

function closeKeyModal() {
    document.getElementById('key-modal').classList.add('hidden');
}

async function testKeys() {
    const openai = document.getElementById('input-openai').value.trim();
    const groq = document.getElementById('input-groq').value.trim();
    const deepseek = document.getElementById('input-deepseek').value.trim(); // NEW
    const resDiv = document.getElementById('test-result');
    
    resDiv.textContent = "TESTING CONNECTION...";
    resDiv.style.color = "yellow";

    let ok = true;
    let msg = [];

    // Test OpenAI
    if(openai) {
        try {
            const res = await fetch("https://api.openai.com/v1/models", { headers: { "Authorization": `Bearer ${openai}` } });
            if(res.ok) msg.push("OpenAI: OK ✅");
            else throw new Error(`OpenAI: ${res.status}`);
        } catch(e) { msg.push(`OpenAI: FAIL ❌`); ok = false; }
    }

    // Test Groq
    if(groq) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": `Bearer ${groq}` } });
            if(res.ok) msg.push("Groq: OK ✅");
            else throw new Error(`Groq: ${res.status}`);
        } catch(e) { msg.push(`Groq: FAIL ❌`); ok = false; }
    }

    // Test DeepSeek (NEW)
    if(deepseek) {
        try {
            const res = await fetch("https://api.deepseek.com/v1/models", { headers: { "Authorization": `Bearer ${deepseek}` } });
            if(res.ok) msg.push("DeepSeek: OK ✅");
            else throw new Error(`DeepSeek: ${res.status}`);
        } catch(e) { msg.push(`DeepSeek: FAIL ❌`); ok = false; }
    }

    resDiv.innerHTML = msg.join("<br>");
    resDiv.style.color = ok ? "#00ff00" : "red";
}

function saveKeys() {
    const openai = document.getElementById('input-openai').value.trim();
    const groq = document.getElementById('input-groq').value.trim();
    const deepseek = document.getElementById('input-deepseek').value.trim(); // NEW

    localStorage.setItem('termos_key_openai', openai);
    localStorage.setItem('termos_key_groq', groq);
    localStorage.setItem('termos_key_deepseek', deepseek); // NEW
    
    CONFIG.keys.openai = openai;
    CONFIG.keys.groq = groq;
    CONFIG.keys.deepseek = deepseek; // NEW
    
    closeKeyModal();
    logSystem("KEYS SAVED.", "system");
    document.getElementById('ai-provider').textContent = "AI: READY";
}

/* --- PERSISTENCE --- */
function saveState() {
    localStorage.setItem('termos_user', JSON.stringify(State.user));
    updateUI();
}

function addXP(amount) {
    State.user.xp += amount;
    const nextLevel = State.user.level * 100;
    if (State.user.xp >= nextLevel) {
        State.user.level++;
        State.user.xp -= nextLevel;
        logSystem(`LEVEL UP! YOU ARE NOW LEVEL ${State.user.level}`, "ai-msg");
    }
    saveState();
}

const AVATARS = { 1: "o_o", 2: "o.o", 3: "(o.o)", 4: "/\\_/\\", 5: "🧙", 6: "🧛", 7: "🤖", 8: "👾", 9: "👽", 10: "🌌" };

/* --- AUDIO --- */
const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (AudioCtx.state === 'suspended') AudioCtx.resume();
    const osc = AudioCtx.createOscillator();
    const gain = AudioCtx.createGain();
    osc.connect(gain); gain.connect(AudioCtx.destination);
    if (type === 'type') { osc.frequency.value = 800; gain.gain.value = 0.05; osc.start(); osc.stop(AudioCtx.currentTime + 0.05); }
    else if (type === 'success') { osc.frequency.value = 440; gain.gain.value = 0.1; osc.start(); osc.stop(AudioCtx.currentTime + 0.3); }
}

/* --- MQTT --- */
function connectMQTT() {
    const clientId = `termos-${State.user.nick}-${Date.now()}`;
    State.client = new Paho.MQTT.Client(CONFIG.mqtt.host, CONFIG.mqtt.port, clientId);
    State.client.onConnectionLost = () => { State.isConnected = false; document.getElementById('net-status').textContent = "OFFLINE"; };
    State.client.onMessageArrived = (msg) => {
        try {
            const data = JSON.parse(msg.payloadString);
            if (data.nick !== State.user.nick) {
                logMessage(data.nick, data.text, "other-msg");
                playSound('type');
            }
        } catch(e){}
    };
    State.client.connect({
        timeout: 10, useSSL: true, mqttVersion: 4, cleanSession: true,
        onSuccess: () => {
            State.isConnected = true;
            document.getElementById('net-status').textContent = "ONLINE";
            joinRoom(State.user.room);
            logSystem("UPLINK ESTABLISHED.", "system");
        },
        onFailure: (e) => { logSystem("MQTT FAILED: " + e.errorMessage, "error-msg"); }
    });
}

function joinRoom(roomKey) {
    if(!State.isConnected) return;
    State.client.unsubscribe(`${CONFIG.mqtt.baseTopic}/${State.user.room}`);
    State.user.room = roomKey;
    State.client.subscribe(`${CONFIG.mqtt.baseTopic}/${roomKey}`);
    document.getElementById('current-room').textContent = CONFIG.rooms[roomKey].name;
    saveState();
    logSystem(`ENTERED ROOM: ${CONFIG.rooms[roomKey].name}`, "system");
}

/* --- AI ENGINE (DEEPSEEK ADDED) --- */
async function queryAI(prompt) {
    logSystem("CONTACTING NEURAL NET...", "ai-msg");
    const systemPrompt = `${CONFIG.rooms[State.user.room].persona} Keep answers short.`;

    let result = null;
    let providerUsed = "LOCAL";

    // 1. TRY OPENAI
    if (CONFIG.keys.openai) {
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.keys.openai}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: prompt }]
                })
            });
            
            if (!res.ok) throw new Error("Quota or Auth Error");
            const data = await res.json();
            result = data.choices[0].message.content;
            providerUsed = "OPENAI";
        } catch (e) { /* Silent fail, try next */ }
    }

    // 2. TRY GROQ
    if (!result && CONFIG.keys.groq) {
        try {
            logSystem("OPENAI FAIL. TRYING GROQ...", "system");
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.keys.groq}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: prompt }]
                })
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            result = data.choices[0].message.content;
            providerUsed = "GROQ";
        } catch (e) { /* Silent fail, try next */ }
    }

    // 3. TRY DEEPSEEK (NEW)
    if (!result && CONFIG.keys.deepseek) {
        try {
            logSystem("OTHERS FAILED. TRYING DEEPSEEK...", "system");
            const res = await fetch("https://api.deepseek.com/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.keys.deepseek}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: prompt }]
                })
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            result = data.choices[0].message.content;
            providerUsed = "DEEPSEEK";
        } catch (e) { 
            logSystem("DEEPSEEK ERROR.", "error-msg"); 
        }
    }

    if (result) {
        logSystem("AI (" + providerUsed + "): " + result, "ai-msg");
        addXP(5);
    } else {
        logSystem("ALL AI PROVIDERS FAILED.", "error-msg");
    }
}

/* --- UI LOGIC --- */
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

const inputField = document.getElementById('command-input');
inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') processInput(inputField.value); });

async function processInput(rawText) {
    const text = rawText.trim().toUpperCase();
    inputField.value = "";
    playSound('type');
    if (!text) return;

    if (text.startsWith('/')) { executeSystemCommand(text); return; }
    
    logMessage(State.user.nick, text, "user-msg");
    
    if (State.isConnected) {
        const msg = new Paho.MQTT.Message(JSON.stringify({ nick: State.user.nick, text: text }));
        msg.destinationName = `${CONFIG.mqtt.baseTopic}/${State.user.room}`;
        State.client.send(msg);
    }
    
    if (text.includes("AI") || text.includes("HELP") || text.includes("?")) queryAI(rawText);
}

function executeSystemCommand(cmd) {
    const parts = cmd.split(' ');
    const command = parts[0].toLowerCase();

    switch (command) {
        case '/help': logSystem("CMD: /ROOM, /NICK, /AI [PROMPT], /CLEAR, /SETUPKEYS", "system"); break;
        case '/room': 
            const r = parts[1]?.toLowerCase();
            if (CONFIG.rooms[r]) joinRoom(r);
            else logSystem("INVALID ROOM", "error-msg"); 
            break;
        case '/nick': 
            State.user.nick = parts[1] || "Anon"; saveState(); 
            logSystem(`NICK UPDATED: ${State.user.nick}`, "system"); 
            break;
        case '/clear': document.getElementById('terminal-output').innerHTML = ""; break;
        case '/ai': 
            const prompt = cmd.substring(4).trim();
            if (prompt) queryAI(prompt); 
            else logSystem("NEED PROMPT", "error-msg"); 
            break;
        case '/setupkeys': openKeyModal(); break;
        case '/stats': logSystem(`LVL ${State.user.level} | XP ${State.user.xp}`, "ai-msg"); break;
        default: logSystem(`UNKNOWN COMMAND`, "error-msg");
    }
}

function logMessage(nick, text, type) {
    const div = document.createElement('div');
    div.className = type;
    const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute:'2-digit' });
    div.innerHTML = `<span style="opacity:0.5">[${time}]</span> <b>&lt;${nick}&gt;</b> ${text}`;
    document.getElementById('terminal-output').appendChild(div);
    scrollToBottom();
    addXP(1);
}

function logSystem(text, type) {
    const div = document.createElement('div');
    div.className = type;
    const time = new Date().toLocaleTimeString([], { hour12: false });
    div.innerHTML = `[${time}] ${text}`;
    document.getElementById('terminal-output').appendChild(div);
    scrollToBottom();
}

function updateUI() {
    document.getElementById('level-display').innerText = State.user.level;
    document.getElementById('avatar-box').textContent = AVATARS[State.user.level] || "o_o";
    const totalForNext = State.user.level * 100;
    const percentage = (State.user.xp / totalForNext) * 100;
    document.getElementById('xp-fill').style.width = `${percentage}%`;
}

function scrollToBottom() { document.getElementById('terminal-output').scrollTop = document.getElementById('terminal-output').scrollHeight; }
function sendMessage() { processInput(inputField.value); }

window.onload = () => { 
    updateUI(); 
    connectMQTT(); 
    logSystem("SYSTEM READY. DEEPSEEK ACTIVE.", "system");
};
</script>
</body>
</html>
