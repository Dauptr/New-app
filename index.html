<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- FIX 1: CRITICAL for Multi-Device Loading -->
    <!-- viewport-fit=cover ensures the app uses the full screen on iPhones (notch) -->
    <!-- user-scalable=no prevents the app from breaking layout on accidental zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Multi-Device App</title>
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- CSS RESET & VARIABLES --- */
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-text: #000000;
            --ios-blue: #007AFF;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg: #000000;
                --ios-card: #1C1C1E;
                --ios-text: #FFFFFF;
            }
        }

        * {
            box-sizing: border-box; /* FIX 2: Prevents elements from overflowing width */
            -webkit-tap-highlight-color: transparent; /* Removes grey tap box on mobile */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #333; /* Dark background for desktop view */
            color: var(--ios-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevents body scroll, handles it inside the app */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- APP CONTAINER --- */
        /* This is the "Phone" screen. On mobile it fills 100%, on desktop it limits width. */
        #app-root {
            width: 100%;
            height: 100%;
            background-color: var(--ios-bg);
            position: relative;
            overflow-y: auto; /* Scroll happens here */
            overflow-x: hidden; /* FIX 2b: No horizontal scrolling */
            display: flex;
            flex-direction: column;
            
            /* Smooth scrolling */
            -webkit-overflow-scrolling: touch;
        }

        /* Desktop Constraint: If screen is wider than 500px, limit app width */
        @media (min-width: 500px) {
            #app-root {
                width: 100%;
                max-width: 414px; /* Max width of large iPhone */
                height: 90vh;
                border-radius: 30px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                border: 8px solid #1c1c1e;
            }
        }

        /* --- HEADER (Glassmorphism) --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: calc(var(--safe-top) + 15px) 20px 15px 20px;
        }

        @media (prefers-color-scheme: dark) {
            header {
                background: rgba(28, 28, 30, 0.8);
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
        }

        h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* --- CONTENT LAYOUT --- */
        main {
            padding: 20px;
            padding-bottom: calc(var(--safe-bottom) + 80px); /* Space for bottom nav */
            flex: 1;
        }

        /* iOS List Group Style */
        .list-group {
            background: var(--ios-card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--ios-card);
            border-bottom: 1px solid rgba(0,0,0,0.05); /* Subtle separator */
            cursor: pointer;
            transition: background 0.2s;
        }
        
        @media (prefers-color-scheme: dark) {
            .list-item { border-bottom: 1px solid rgba(255,255,255,0.1); }
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:active {
            background-color: rgba(0,0,0,0.05);
        }
        @media (prefers-color-scheme: dark) {
            .list-item:active { background-color: rgba(255,255,255,0.05); }
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
            color: var(--ios-blue);
        }

        .item-text {
            flex: 1;
            font-size: 17px;
        }

        /* --- BOTTOM NAV --- */
        nav.bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + var(--safe-bottom)) 0;
            z-index: 100;
        }

        @media (prefers-color-scheme: dark) {
            nav.bottom-nav {
                background: rgba(28, 28, 30, 0.9);
                border-top: 1px solid rgba(255,255,255,0.1);
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #999;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--ios-blue);
        }

        .nav-item i {
            font-size: 24px;
        }

        /* Loading Animation (Fixes visual "blank load") */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--ios-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="app-root">
        <header>
            <h1>Dashboard</h1>
        </header>

        <main id="main-content">
            <!-- JS will inject content here, but we provide fallback -->
            <div class="loader" id="loader"></div>
            
            <!-- Example Content (Visible after JS Load) -->
            <div id="content-area" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <h3 style="margin: 0 0 5px 0;">Welcome Back</h3>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 15px;">Your system is optimized.</p>
                </div>

                <div class="list-group">
                    <div class="list-item">
                        <div class="icon-box"><i class="ph ph-wallet"></i></div>
                        <div class="item-text">Account Balance</div>
                        <i class="ph ph-caret-right" style="color: #ccc;"></i>
                    </div>
                    <div class="list-item">
                        <div class="icon-box"><i class="ph ph-gear"></i></div>
                        <div class="item-text">Settings</div>
                        <i class="ph ph-caret-right" style="color: #ccc;"></i>
                    </div>
                    <div class="list-item">
                        <div class="icon-box" style="color: var(--danger-color); background: rgba(255,59,48,0.1);"><i class="ph ph-sign-out"></i></div>
                        <div class="item-text" style="color: var(--danger-color);">Log Out</div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(this)">
                <i class="ph ph-house-fill"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchTab(this)">
                <i class="ph ph-chart-bar"></i>
                <span>Stats</span>
            </div>
            <div class="nav-item" onclick="switchTab(this)">
                <i class="ph ph-user"></i>
                <span>Profile</span>
            </div>
        </nav>
    </div>

    <script>
        // Simple script to simulate app load
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const content = document.getElementById('content-area');

            // Simulate a 500ms network load
            setTimeout(() => {
                loader.style.display = 'none';
                content.style.display = 'block';
            }, 500);
        });

        // Tab Switching Logic
        function switchTab(element) {
            // Remove active class from all
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                // Reset icons to outline
                const icon = el.querySelector('i');
                if(icon.classList.contains('ph-house-fill')) icon.className = 'ph ph-house';
                if(icon.classList.contains('ph-chart-bar-fill')) icon.className = 'ph ph-chart-bar';
                if(icon.classList.contains('ph-user-fill')) icon.className = 'ph ph-user';
            });

            // Add active to clicked
            element.classList.add('active');
            
            // Switch icons to fill
            const icon = element.querySelector('i');
            if(icon.classList.contains('ph-house')) icon.className = 'ph ph-house-fill';
            if(icon.classList.contains('ph-chart-bar')) icon.className = 'ph ph-chart-bar-fill';
            if(icon.classList.contains('ph-user')) icon.className = 'ph ph-user-fill';

            // In a real app, you would load different content here
        }
    </script>
</body>
</html>
